group = "com.example.flutter_unisdk"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.huawei.agconnect"

android {
    namespace = "com.example.flutter_unisdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    buildTypes {
        release {
            consumerProguardFiles "consumer-rules.pro"
        }
    }
}

dependencies {
    implementation "com.huawei.hms:push:6.12.0.300"
    implementation "com.huawei.hms:hianalytics:6.12.0.300"
    implementation "com.huawei.hms:hwid:6.12.0.300"
    implementation "com.huawei.hms:base:6.12.0.300"
    implementation "com.huawei.hms:ads-identifier:3.4.68.300"

    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.mockito:mockito-core:5.0.0"
}
